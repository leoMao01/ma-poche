<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ma poche</title>
<style>
:root {
  color-scheme: light;
  --bg: #f4f4f7; --surface: #fff; --surface-2: #eeeef2; --line: #e8e8ed;
  --text: #0a0a0f; --text-2: #5f5f6b; --accent: #0a0a0f; --accent-ink: #fff; --brand: #4f55f1; --brand-soft: #eceefe; --brand-ink: #2c2f9e;
  --good-bg: #e4f6ec; --good-ink: #14613a; --bad-bg: #fde8e6; --bad-ink: #a3241f;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
.wrap { max-width: 860px; margin: 0 auto; padding: 16px 20px 64px; }
header { display: flex; justify-content: center; align-items: center; gap: 8px; margin-bottom: 20px; }
#gear { width: 40px; height: 40px; padding: 0; flex: none; display: grid; place-items: center; color: var(--text-2); }
#gear[aria-current="page"] { background: var(--accent); color: var(--accent-ink); }
.tabs { min-width: 0; overflow-x: auto; scrollbar-width: none; display: inline-flex; background: var(--surface-2); border-radius: 99px; padding: 4px; }
.tabs button { flex: none; background: none; color: var(--text-2); padding: 7px 22px; }
.tabs button[aria-current="page"] { background: var(--surface); color: var(--text); }
button { font: inherit; font-weight: 600; border: 0; background: var(--surface-2); color: var(--text); border-radius: 99px; padding: 9px 16px; cursor: pointer; }
button.primary { background: var(--accent); color: var(--accent-ink); }
button.link { background: none; padding: 2px 4px; color: var(--text-2); text-decoration: underline; font-size: 13.5px; font-weight: 500; }
button:focus-visible, input:focus-visible, summary:focus-visible, tr:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.btn { font-weight: 600; background: var(--surface-2); border-radius: 99px; padding: 9px 16px; cursor: pointer; display: inline-block; }
.card { background: var(--surface); border-radius: 22px; padding: 22px; margin-bottom: 14px; }
.nav { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 14px; }
.nav button { width: 38px; height: 38px; padding: 0; background: var(--surface); font-size: 18px; }
.nav strong { min-width: 170px; text-align: center; font-size: 17px; }
.label { color: var(--text-2); }
.big { font-size: 42px; font-weight: 720; letter-spacing: -.03em; line-height: 1.12; font-variant-numeric: tabular-nums; }
.mid { font-size: 32px; font-weight: 700; letter-spacing: -.02em; line-height: 1.2; font-variant-numeric: tabular-nums; }
.lines { margin-top: 14px; font-size: 14px; color: var(--text-2); }
.lines div { display: flex; justify-content: space-between; padding: 3px 0; font-variant-numeric: tabular-nums; }
.muted { color: var(--text-2); font-size: 13.5px; }
h2 { font-size: 16px; margin: 0 0 8px; letter-spacing: -.01em; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 10px 8px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
th { color: var(--text-2); font-weight: 500; }
.n { text-align: right; font-variant-numeric: tabular-nums; }
tfoot td { font-weight: 680; border-bottom: 0; }
tbody tr[data-act] { cursor: pointer; }
tbody tr[data-act]:hover { background: var(--bg); }
tr.sel { background: var(--brand-soft); }
.strong { font-weight: 680; }
form.entry { display: grid; grid-template-columns: 160px 1fr 1.4fr auto; gap: 10px; align-items: end; }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 13.5px; color: var(--text-2); }
select { font: inherit; color: var(--text); background: var(--bg); border: 1px solid transparent; border-radius: 12px; padding: 10px 12px; width: 100%; min-width: 0; }
input { font: inherit; color: var(--text); background: var(--bg); border: 1px solid transparent; border-radius: 12px; padding: 10px 12px; width: 100%; min-width: 0; }
.settings { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; align-items: end; }
#fiscal { align-items: start; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.saved div { display: flex; justify-content: space-between; gap: 16px; padding: 11px 0; border-top: 1px solid var(--line); }
.saved div:first-child { border-top: 0; }
.saved span { color: var(--text-2); }
.saved b { font-weight: 620; font-variant-numeric: tabular-nums; text-align: right; }
.month-card { background: #15151f; color: #fff; }
.month-card .nav { justify-content: space-between; margin-bottom: 18px; }
.month-card .nav button { background: rgba(255,255,255,.14); color: #fff; }
.month-card .label, .month-card .lines, .month-card .muted, .month-card button.link { color: #c9c9d6; }
.year-title { margin: 24px 0 10px; font-size: 18px; }
.year-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px 16px; flex-wrap: wrap; margin-bottom: 14px; }
.year-head strong { font-size: 17px; }
.year-head .cashed { margin: 0; }
.budget-row { display: grid; grid-template-columns: 1fr 130px auto; gap: 8px; align-items: center; margin-bottom: 8px; }
.dots { display: flex; gap: 6px; margin-top: 10px; }
.dots i { width: 28px; height: 6px; border-radius: 3px; background: var(--surface-2); }
.dots i.on { background: var(--brand); }
.full { grid-column: 1 / -1; }
label.c { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; }
input[type=checkbox] { width: auto; margin-top: 3px; }
.head-simple h1 { font-size: 22px; margin: 0 0 14px; }
.month-card .lines .result { color: #fff; font-weight: 650; border-top: 1px solid rgba(255,255,255,.14); margin-top: 4px; padding-top: 8px; }
.tax-row { display: grid; grid-template-columns: 1fr 120px 80px 16px; gap: 8px; align-items: center; margin-bottom: 8px; font-size: 14px; color: var(--text-2); }
[hidden] { display: none !important; }
.short { display: none; }
dialog { border: 0; border-radius: 22px; padding: 22px; width: min(460px, calc(100vw - 32px)); color: var(--text); }
dialog::backdrop { background: rgba(10,10,15,.45); }
dialog h2 { font-size: 19px; margin-bottom: 14px; }
.entry-modal { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: end; }
.entry-modal .wide { grid-column: 1 / -1; }
.owe { margin-top: 18px; border-radius: 16px; background: var(--bg); padding: 6px 14px; }
.owe-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.owe-row:first-child { border-top: 0; }
.owe-txt span { display: block; font-size: 13px; color: var(--text-2); }
.owe-txt { flex: 1; }
.num { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; background: var(--surface-2); color: var(--text-2); flex: none; }
.nav-title { text-align: center; }
.nav-title .cashed { margin: 2px 0 0; }
.cashed { font-size: 13px; color: var(--text-2); margin-bottom: 8px; font-variant-numeric: tabular-nums; }
.month-card .cashed { color: #c9c9d6; }
.step-main { display: flex; gap: 12px; align-items: flex-start; }
.step-main .num { margin-top: 3px; background: var(--brand); color: #fff; }
.owe-row.declare > b { color: var(--brand); }
.owe-row.declare .owe-txt b::after { content: ' · info'; font-weight: 500; color: var(--text-2); font-size: 12px; }
.month-card .num { background: rgba(255,255,255,.14); color: #fff; }
.month-card .step-main .num { background: #fff; color: #15151f; }
.month-card .owe-row.declare > b { color: #9fb2ff; }
.month-card .owe { background: rgba(255,255,255,.08); }
.month-card .owe-txt span { color: #c9c9d6; }
.month-card .owe-row { border-color: rgba(255,255,255,.14); }
.add-row { display: flex; justify-content: flex-end; margin-top: 14px; }
.add-btn { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.35); font-size: 14px; padding: 7px 14px; }
.add-btn:hover { background: rgba(255,255,255,.12); }
.banner { border-radius: 14px; padding: 11px 14px; margin-bottom: 14px; }
.good { background: var(--good-bg); color: var(--good-ink); }
.info { background: var(--brand-soft); color: var(--brand-ink); }
.info button.link { color: inherit; }
.bad { background: var(--bad-bg); color: var(--bad-ink); }
.month { display: flex; justify-content: space-between; gap: 10px; font-weight: 650; padding: 16px 0 6px; flex-wrap: wrap; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.entry-line { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.entry-line .amt { font-weight: 620; font-variant-numeric: tabular-nums; white-space: nowrap; }
details summary { cursor: pointer; font-weight: 600; }
details[open] summary { margin-bottom: 14px; }
@media (max-width: 640px) {
  .wrap { padding: 12px 16px 56px; }
  .card { padding: 18px; }
  .big { font-size: 36px; }
  form.entry { grid-template-columns: 1fr 1fr; }
  form.entry .wide { grid-column: 1 / -1; }
  th.opt, td.opt { display: none; }
  .long { display: none; }
  .short { display: inline; }
  .tabs button { padding: 7px 10px; font-size: 13px; white-space: nowrap; }
  .tax-row { grid-template-columns: 1fr 88px 58px 14px; }
  .budget-row { grid-template-columns: 1fr 96px auto; }
}
</style>
</head>
<body>
<div class="wrap">
  <header><div class="tabs" id="tabs"></div><button id="gear" data-act="tab" data-v="params" aria-label="Paramètres" title="Paramètres"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0-1.2-2.9H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.2-2.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></header>
  <main id="main"></main>
</div>
<div id="modal"></div>
<script>
const KEY = 'suivi-facturation-v1';
// Barème 2026 pour une part (service-public) et taux 2026 (urssaf.fr). Tout est modifiable dans les paramètres.
const BAREME_2026 = [[11600, 0], [29579, 11], [84577, 30], [181917, 41], [null, 45]];
const ACTIVITES = {
  bnc: { label: 'Profession libérale non réglementée (BNC)', urssaf: 25.8, vl: 2.2, abattement: 34 },
  cipav: { label: 'Profession libérale réglementée, Cipav (BNC)', urssaf: 23.4, vl: 2.2, abattement: 34 },
  services: { label: 'Prestation de services commerciale (BIC)', urssaf: 21.3, vl: 1.7, abattement: 50 },
  artisan: { label: 'Prestation de services artisanale (BIC)', urssaf: 21.5, vl: 1.7, abattement: 50 },
  vente: { label: 'Vente de marchandises (BIC)', urssaf: 12.4, vl: 1, abattement: 71 },
};
const DEFAULTS = { configured: false, activite: 'bnc', tvaOn: true, tvaRate: 20, urssafRate: 25.8, vl: false, abattement: 34, bareme: BAREME_2026, decoteSeul: 897, decoteCouple: 1483, parts: 1, autresRevenus: 0, impotPerso: null };
const MONTHS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
const now = new Date();
let ui = { tab: 'poche', y: now.getFullYear(), m: now.getMonth() + 1, editId: null, notice: null };
let db = load();

// Une seule fois : ramène une ancienne liste de charges à logement, abonnements et assurance, en gardant leurs montants.
function migrateBudget(d) {
  if (d.budget && !d.settings.budgetClean) {
    const find = re => d.budget.find(x => re.test(x.label.toLowerCase()))?.amount || 0;
    d.budget = [['Logement', /logement|loyer/], ['Abonnements', /abonnement/], ['Assurance', /assurance/]].map(([label, re]) => ({ label, amount: find(re) }));
  }
  d.settings.budgetClean = true;
  return d;
}
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY));
    if (d && Array.isArray(d.encs)) return migrateBudget({ ...d, settings: { ...DEFAULTS, ...d.settings } });
  } catch (e) {}
  return { encs: [], settings: { ...DEFAULTS } };
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); }
  catch (e) { ui.notice = { kind: 'bad', text: "Le navigateur a refusé d'enregistrer. Télécharge une sauvegarde tout de suite." }; }
}
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const eur = c => (c / 100).toLocaleString('fr-FR', { style: 'currency', currency: 'EUR' });
const pad = n => String(n).padStart(2, '0');
const cap = s => s[0].toUpperCase() + s.slice(1);
const pctTxt = n => n.toFixed(1).replace('.', ',') + ' %';
const today = () => `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
function parseMoney(v) {
  let s = String(v ?? '').replace(/[\s  €]/g, '');
  const neg = s.startsWith('-'); s = s.replace(/^[-+]/, '');
  const i = Math.max(s.lastIndexOf(','), s.lastIndexOf('.'));
  if (i >= 0 && s.length - i - 1 <= 2) s = s.slice(0, i).replace(/[.,]/g, '') + '.' + s.slice(i + 1);
  else s = s.replace(/[.,]/g, '');
  if (!/^\d+(\.\d*)?$|^\.\d+$/.test(s)) return null;
  const c = Math.round(parseFloat(s) * 100);
  return neg ? -c : c;
}
const parseNum = v => { const n = parseFloat(String(v).replace(/\s/g, '').replace(',', '.')); return isFinite(n) ? n : null; };

// Chaque saisie garde ses taux : les changer plus tard ne réécrit pas le passé.
function calc(e) {
  const r = e.rates || { tva: db.settings.tvaRate, urssaf: db.settings.urssafRate };
  const tva = Math.round(e.ttc * r.tva / (100 + r.tva)), ht = e.ttc - tva, urssaf = Math.round(ht * r.urssaf / 100);
  return { ttc: e.ttc, ht, tva, urssaf, poche: e.ttc - tva - urssaf };
}
function total(list) { const t = { ttc: 0, ht: 0, tva: 0, urssaf: 0, poche: 0 }; for (const e of list) { const c = calc(e); for (const k in t) t[k] += c[k]; } return t; }
const inMonth = (y, m) => db.encs.filter(e => e.date.startsWith(`${y}-${pad(m)}`));
const inYear = y => db.encs.filter(e => e.date.startsWith(String(y)));

function incomeTax(rev, parts, couple) {
  const q = rev / parts; let tax = 0, low = 0;
  const st = db.settings;
  for (const [top, r] of st.bareme) { const t = top === null ? Infinity : top; if (q > low) tax += (Math.min(q, t) - low) * r / 100; low = t; }
  tax *= parts;
  return Math.max(0, tax - Math.max(0, (couple ? st.decoteCouple : st.decoteSeul) - tax * .4525));
}
// Une fiche par année. Sans fiche enregistrée, on repart de l'année précédente (sans ses acomptes), sinon des valeurs par défaut.
const MIN_MONTHS = 3;
// Du premier au dernier mois saisi. Un mois vide entre les deux (vacances) compte, ceux d'avant ou d'après non.
function monthSpan(y) {
  const ms = inYear(y).map(e => +e.date.slice(5, 7));
  if (!ms.length) return { first: 0, last: 0, count: 0, filled: 0 };
  const first = Math.min(...ms), last = Math.max(...ms);
  return { first, last, count: last - first + 1, filled: new Set(ms).size };
}
function fiscal(y) {
  const all = db.fiscal || {}, s = db.settings;
  if (all[y]) return all[y];
  const prev = Object.keys(all).filter(k => +k < y).sort().pop();
  if (prev) return { ...all[prev], acomptes: 0, caHT: null, saved: false };
  return { couple: s.parts >= 2, parts: s.parts, autres: s.autresRevenus, deductions: 0, reductions: 0, acomptes: 0, taux: s.impotPerso, caHT: null, saved: false };
}
// Année en cours : CA projeté à partir du dernier mois saisi. Micro-BNC : 34 % d'abattement, 305 € minimum.
function taxFor(y) {
  const f = fiscal(y), ht = total(inYear(y)).ht / 100;
  const span = monthSpan(y), lastMonth = span.last;
  // Un CA HT saisi à la main (année passée, sans encaissements dans l'outil) remplace les saisies pour l'impôt.
  const manual = f.caHT != null, projected = !manual && y === now.getFullYear() && lastMonth > 0 && lastMonth < 12;
  // Les mois restants suivent la moyenne depuis le premier mois saisi. Les mois d'avant ne sont pas supposés à zéro dans la moyenne.
  const ca = manual ? f.caHT : Math.max(0, projected ? ht + ht / span.count * (12 - lastMonth) : ht), imposable = Math.max(0, ca - Math.max(ca * db.settings.abattement / 100, 305));
  const net = rev => Math.max(0, incomeTax(Math.max(0, rev - f.deductions), f.parts, f.couple) - f.reductions);
  const foyer = net(f.autres + imposable), activite = foyer - net(f.autres), reste = Math.max(0, activite - f.acomptes);
  const vl = db.settings.vl;
  return { ca, imposable, foyer, activite, reste: vl ? 0 : reste, acomptes: f.acomptes, rate: vl ? 0 : f.taux !== null ? f.taux : ca > 0 ? reste / ca * 100 : 0, projected, perso: !vl && f.taux !== null, saved: f.saved, vl, manual };
}

function render() {
  $('#tabs').innerHTML = [['poche', 'Ma poche'], ['saisie', 'Saisie'], ['fiscal', '<span class="long">Situation fiscale</span><span class="short">Fiscal</span>'], ['budget', 'Budget']].map(([k, v]) => `<button data-act="tab" data-v="${k}" ${ui.tab === k ? 'aria-current="page"' : ''}>${v}</button>`).join('');
  if (ui.tab === 'params') $('#gear').setAttribute('aria-current', 'page'); else $('#gear').removeAttribute('aria-current');
  // La fenêtre passe en premier : c'est elle qui affiche une éventuelle erreur de saisie.
  const modal = ui.add ? viewAdd() : '';
  $('#main').innerHTML = { poche: viewPoche, saisie: viewSaisie, fiscal: viewFiscal, budget: viewBudget, params: viewParams }[ui.tab]();
  $('#modal').innerHTML = modal;
  if (modal) { const d = $('#addDlg'); d.addEventListener('cancel', () => { ui.add = null; setTimeout(render); }); d.showModal(); }
}
function notice() { if (!ui.notice) return ''; const n = ui.notice; ui.notice = null; return `<div class="banner ${n.kind}" role="status">${esc(n.text)}</div>`; }
// Lecture en étapes : pour moi, URSSAF, CA HT à déclarer, TVA, impôts. Les montants mis de côté additionnés font l'encaissé TTC.
function split(t, rate) {
  const vl = db.settings.vl, impot = vl ? 0 : Math.max(0, Math.round(t.ht * rate / 100));
  return { ...t, impot, moi: t.poche - impot, vl };
}
function steps(t, size) {
  const rows = [
    [`Pour l'URSSAF`, t.vl ? 'Cotisations et impôt, à mettre de côté' : 'Cotisations, à mettre de côté', t.urssaf],
    [`À déclarer à l'URSSAF`, `Chiffre d'affaires hors TVA`, t.ht, 'declare'],
    ...(t.tva ? [['Pour la TVA', 'À mettre de côté, reversée aux impôts', t.tva]] : []),
    ...(t.vl ? [] : [['Pour les impôts', 'Estimation, à mettre de côté', t.impot]]),
  ];
  return `<div class="step-main"><span class="num">1</span><div><div class="label">Pour moi</div><div class="${size}">${eur(t.moi)}</div></div></div>
    <div class="owe">${rows.map(([who, what, a, kind], i) => `<div class="owe-row ${kind || ''}"><span class="num">${i + 2}</span><div class="owe-txt"><b>${who}</b><span>${what}</span></div><b>${eur(a)}</b></div>`).join('')}</div>`;
}
// L'année sert de vue d'ensemble : ce qui reste pour moi, plus la TVA et l'impôt, qui se règlent sur l'année.
function yearSummary(t, y, note) {
  const rows = [...(t.tva ? [['Pour la TVA', 'À mettre de côté', t.tva]] : []), ...(t.vl ? [] : [['Pour les impôts', 'Estimation, à mettre de côté', t.impot]])];
  return `<div class="year-head"><strong>Toute l'année ${y}</strong><span class="cashed">Encaissé TTC : ${eur(t.ttc)}</span></div><div class="label">Pour moi</div><div class="mid">${eur(t.moi)}</div>${rows.length ? `<div class="owe">${rows.map(([who, what, a]) => `<div class="owe-row"><div class="owe-txt"><b>${who}</b><span>${what}</span></div><b>${eur(a)}</b></div>`).join('')}</div>` : ''}${note}`;
}
function viewPoche() {
  const { y, m } = ui, tax = taxFor(y), mt = split(total(inMonth(y, m)), tax.rate), yt = split(total(inYear(y)), tax.rate);
  let h = notice();
  if (!db.settings.configured) h += `<div class="banner info">Calcul par défaut : libéral BNC, TVA 20 %, URSSAF 25,8 %. <button class="link" data-act="tab" data-v="params">Adapter à ma situation</button></div>`;

const actions = {

  prev: () => { if (--ui.m < 1) { ui.m = 12; ui.y--; } },
  next: () => { if (++ui.m > 12) { ui.m = 1; ui.y++; } },
  pick: t => ui.m = +t.dataset.v,
  edit: t => { ui.editId = t.dataset.id; scrollTo(0, 0); },
  cancel: () => ui.editId = null,
  del: t => { const e = db.encs.find(x => x.id === t.dataset.id); if (confirm(`Supprimer l'encaissement de ${eur(e.ttc)} ?`)) { db.encs = db.encs.filter(x => x !== e); save(); } },
  backup: () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' })); a.download = `ma-poche-${today()}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); },
};
document.addEventListener('click', ev => { const t = ev.target.closest('[data-act]'); if (t) { if (actions[t.dataset.act](t) !== false) render(); } });
document.addEventListener('keydown', ev => { if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches?.('tr[data-act]')) { ev.preventDefault(); ev.target.click(); } });
document.addEventListener('change', ev => {
  const c = ev.target;

  if (c.id === 'activite' || c.id === 'vl') { const f = c.form, a = ACTIVITES[f.activite.value]; f.urssafRate.value = String(+(a.urssaf + (f.vl.checked ? a.vl : 0)).toFixed(1)).replace('.', ','); f.abattement.value = a.abattement; return; }

      const d = JSON.parse(txt);
      if (!Array.isArray(d.encs)) throw 0;
      if (confirm(`Remplacer tes données par cette sauvegarde (${d.encs.length} encaissements) ?`)) { db = migrateBudget({ ...d, settings: { ...DEFAULTS, ...d.settings } }); save(); ui.notice = { kind: 'good', text: 'Sauvegarde restaurée.' }; }
    } catch (e) { ui.notice = { kind: 'bad', text: "Ce fichier n'est pas une sauvegarde valide." }; }
    render();
  });
});
document.addEventListener('submit', ev => {
  ev.preventDefault();
  const f = ev.target, v = Object.fromEntries(new FormData(f));
  if (f.id === 'entry') {
    const ttc = parseMoney(v.ttc);
    if (!ttc || !/^\d{4}-\d{2}-\d{2}$/.test(v.date)) { if (ui.add) ui.add = { date: v.date, ttc: v.ttc, client: v.client }; ui.notice = { kind: 'bad', text: 'Vérifie la date et le montant.' }; return render(); }
    const old = ui.editId && db.encs.find(x => x.id === ui.editId);
    const e = old ? Object.assign(old, { date: v.date, ttc, client: v.client.trim() }) : { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7), date: v.date, ttc, client: v.client.trim(), rates: { tva: db.settings.tvaOn ? db.settings.tvaRate : 0, urssaf: db.settings.urssafRate } };
    if (!old) db.encs.push(e);
    save(); ui.editId = null; ui.add = null; ui.y = +v.date.slice(0, 4); ui.m = +v.date.slice(5, 7);
    const c = split(calc(e), taxFor(ui.y).rate);
    ui.notice = { kind: 'good', text: `${old ? 'Modifié' : 'Ajouté'} : ${eur(c.moi)} pour toi, une fois l'URSSAF, ${c.tva ? 'la TVA et ' : ''}les impôts mis de côté.` };
  } else if (f.id === 'params') {
    const pct = x => { const n = parseNum(x); return n !== null && n >= 0 && n < 100 ? n : null; };
    const old = db.settings.bareme, bareme = old.map(([top], i) => [top === null ? null : parseNum(v[`top${i}`]), pct(v[`rate${i}`])]);
    const asc = bareme.slice(0, -1).every(([t, r], i, a) => t > 0 && r !== null && (!i || t > a[i - 1][0])) && bareme[bareme.length - 1][1] !== null;
    const r = { urssafRate: pct(v.urssafRate), abattement: pct(v.abattement), tvaRate: v.tvaOn ? pct(v.tvaRate) : db.settings.tvaRate, decoteSeul: parseNum(v.decoteSeul), decoteCouple: parseNum(v.decoteCouple) };
    if (Object.values(r).includes(null) || r.decoteSeul < 0 || r.decoteCouple < 0 || !asc) ui.notice = { kind: 'bad', text: 'Un paramètre est invalide. Vérifie les taux et que les tranches du barème vont en augmentant.' };
    else { Object.assign(db.settings, r, { bareme, activite: v.activite, vl: !!v.vl, tvaOn: !!v.tvaOn, configured: true }); save(); ui.notice = { kind: 'good', text: 'Paramètres enregistrés.' }; }
  } else if (f.id === 'extra') {
    const key = `${ui.y}-${pad(ui.m)}`, raw = String(v.amount).trim(), a = raw ? parseMoney(raw) : 0;
    if (a === null || a < 0) ui.notice = { kind: 'bad', text: 'Indique un montant positif, ou laisse vide.' };
    else { db.extras = (db.extras || []).filter(x => x.month !== key); if (a) db.extras.push({ month: key, amount: a }); save(); ui.notice = { kind: 'good', text: 'Dépenses du mois enregistrées.' }; }
  } else if (f.id === 'budget') {
    const rows = readBudgetForm().filter(x => x.label.trim() || String(x.amount).trim());
    const clean = rows.map(x => ({ label: x.label.trim(), amount: String(x.amount).trim() ? parseMoney(x.amount) : 0 }));
    if (clean.some(x => !x.label || x.amount === null || x.amount < 0)) ui.notice = { kind: 'bad', text: 'Chaque ligne a besoin d\'un nom et d\'un montant positif.' };
    else { db.budget = clean; save(); ui.budgetDraft = null; ui.notice = { kind: 'good', text: 'Charges enregistrées.' }; }
  } else if (f.id === 'fiscal') {
    const vals = Object.fromEntries(FIELDS.map(([k]) => [k, parseNum(v[k])])), taux = String(v.taux).trim() ? parseNum(v.taux) : null, caHT = String(v.caHT).trim() ? parseNum(v.caHT) : null;
    if (!(vals.parts >= 1) || FIELDS.some(([k]) => !(vals[k] >= 0)) || (String(v.taux).trim() && (taux === null || taux < 0 || taux >= 100)) || (String(v.caHT).trim() && (caHT === null || caHT < 0))) ui.notice = { kind: 'bad', text: 'Vérifie les montants (au moins 1 part, pas de valeur négative).' };
    else { (db.fiscal ||= {})[ui.y] = { ...vals, couple: v.couple === '1', taux, caHT, saved: true }; save(); ui.fiscalEdit = false; ui.notice = { kind: 'good', text: 'Situation enregistrée.' }; }
  }
  render();
});
render();
</script>
